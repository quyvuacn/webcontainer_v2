networks:
  cliproxyapi-net:
    driver: bridge
services:
  cliproxyapi:
    image: eceasy/cli-proxy-api-plus:latest
    container_name: cliproxyapi
    ports:
      - "8317:8317"
    volumes:
      # Logs
      - ./logs:/CLIProxyAPI/logs
      # Git config (if you want to override)
      - ./config.yaml:/CLIProxyAPI/config.yaml
      # Override any gitstore-synced config inside container
      # - ./config.yaml:/app/gitstore/config/config.yaml:ro
    env_file: .env
    restart: unless-stopped