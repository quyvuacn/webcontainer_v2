networks:
  cliproxyapi-net:
    driver: bridge
services:
  cliproxyapi:
    image: eceasy/cli-proxy-api-plus:latest
    container_name: cliproxyapi
    ports:
      - "8317:8317"
    volumes:
      - ./logs:/CLIProxyAPI/logs
      - ./config.yaml:/CLIProxyAPI/config.yaml
    restart: unless-stopped