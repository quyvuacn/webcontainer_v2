server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Required for SharedArrayBuffer (COOP/COEP)
    add_header Cross-Origin-Opener-Policy  "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Never cache the service worker
    location = /sw.js {
        add_header Cross-Origin-Opener-Policy  "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # Forward /pkg/* → npm proxy server (strips /pkg prefix)
    location /pkg/ {
        proxy_pass         http://proxy:4873/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;

        # Allow cross-origin resource loading under COEP
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # All other routes — SPA fallback
    location / {
        add_header Cross-Origin-Opener-Policy  "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri $uri/ /index.html;
    }
}
