<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Node - Phase 1</title>
</head>
<body>
  <div id="app">
    <h1>Browser Node - Phase 1 Demo</h1>
    <p id="status">Đang khởi động...</p>
    <div>
      <h2>RamVfs + OPFS</h2>
      <button id="btn-write">Ghi file project/index.html</button>
      <button id="btn-read">Đọc VFS file</button>
      <button id="btn-f5">F5 để test restore từ OPFS</button>
    </div>
    <div>
      <h2>http.createServer (Phase 2)</h2>
      <button id="btn-http">Fetch /__port__/3000/</button>
      <p id="http-result"></p>
    </div>
    <div>
      <h2>npm (Phase 4)</h2>
      <button id="btn-npm">npm install</button>
      <button id="btn-npm-ci">npm ci</button>
      <p id="npm-result"></p>
    </div>
    <div>
      <h2>child_process.spawnSync (Phase 3)</h2>
      <button id="btn-spawn">Chạy project/hello.js</button>
      <p id="spawn-result"></p>
    </div>
    <div>
      <h2>fs.watch (0ms) + HMR-like</h2>
      <textarea id="editor" rows="4" style="width:100%"><h1>Demo từ VFS</h1><p>Chỉnh sửa rồi click Ghi - watcher fire, iframe reload</p></textarea>
      <p id="watch-log"></p>
      <iframe id="preview" style="border:1px solid #ccc;width:100%;height:120px"></iframe>
    </div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
