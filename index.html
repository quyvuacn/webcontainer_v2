<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Node Shell</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0d1117;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      user-select: none;
      flex-shrink: 0;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }
    #title {
      flex: 1;
      text-align: center;
      color: #8b949e;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 13px;
    }
    #terminal-wrapper {
      flex: 1;
      min-height: 200px;
      padding: 12px;
      overflow: hidden;
      display: flex;
    }
    #terminal {
      flex: 1;
      min-height: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
      <span id="title">Browser Node — Virtual Shell</span>
    </div>
    <div id="terminal-wrapper">
      <div id="terminal"></div>
    </div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
